services:
  postgres:
    image: postgres:16
    container_name: awsdemo-postgres
    environment:
      POSTGRES_DB: awsdemo
      POSTGRES_USER: awsdemo
      POSTGRES_PASSWORD: awsdemo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
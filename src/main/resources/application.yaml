spring:
  application:
    name: awsdemo

  datasource:
    url: jdbc:postgresql://localhost:5432/awsdemo
    username: awsdemo
    password: awsdemo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

aws:
  region: us-east-1
  endpoint: http://localhost:4566   # LocalStack
  credentials:
    access-key: test
    secret-key: test
  s3:
    bucket-name: awsdemo-files
  sqs:
    queue-name: awsdemo-processing
  dynamodb:
    table-name: ProcessingStatus
  ses:
    from-email: noreply@awsdemo.com
    to-email: dev@awsdemo.com

logging:
  level:
    com.example.awsdemo: DEBUG
    org.hibernate.SQL: DEBUG